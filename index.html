function rects(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function update(dt){if(over||won||paused)return;const dir=(input.right?1:0)-(input.left?1:0);player.vx=dir*SPEED;if(dir)player.face=dir;player.x=Math.max(0,Math.min(WORLD-player.w,player.x+player.vx*dt));
if(input.jumpQueued&&player.onGround){player.vy=JUMP;player.onGround=false;tone(300,.08,'square',.018);}input.jumpQueued=false;
const oldBottom=player.y+player.h;player.vy=Math.min(900,player.vy+GRAVITY*dt);player.y+=player.vy*dt;player.onGround=false;
for(const p of platforms){if(player.x+player.w>p.x&&player.x<p.x+p.w&&oldBottom<=p.y+3&&player.y+player.h>=p.y&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.onGround=true;}}
for(const c of coinItems){if(!c.taken&&Math.abs(player.x+player.w/2-c.x)<25&&Math.abs(player.y+player.h/2-c.y)<34){c.taken=true;coinCount++;bankCoins++;saveShop();score+=100;tone(880,.08,'sine',.025);}}if(!secretFound&&Math.abs(player.x-secretX)<42&&player.y<groundY()-105){secretFound=true;coinCount+=5;bankCoins+=5;score+=1200;saveShop();tone(1040,.25,'triangle',.04);}
for(const h of hazards){if(player.x+player.w>h.x&&player.x<h.x+h.w&&player.y+player.h>groundY()-h.h-4&&player.y+player.h<groundY()+8&&player.invulnerable<=0){lives--;player.invulnerable=1.25;player.vy=JUMP*.55;player.x=Math.max(0,player.x-65);if(lives<=0)over=true;}}
for(const e of enemies){e.x+=e.dir*82*dt;if(e.x<e.min){e.x=e.min;e.dir=1}if(e.x>e.max){e.x=e.max;e.dir=-1}const eb={x:e.x,y:e.y,w:e.w,h:e.h},pb={x:player.x,y:player.y,w:player.w,h:player.h};if(rects(pb,eb)){if(player.vy>80&&oldBottom<=e.y+12){e.defeated=true;player.vy=JUMP*.58;score+=250;}else if(player.invulnerable<=0){lives--;player.invulnerable=1.25;player.vy=JUMP*.45;player.x=Math.max(0,player.x-45);if(lives<=0)over=true;}}}
enemies=enemies.filter(e=>!e.defeated);
if(boss.active){boss.y=groundY()-boss.h;boss.flash=Math.max(0,boss.flash-dt);const bb={x:boss.x,y:boss.y,w:boss.w,h:boss.h},pb={x:player.x,y:player.y,w:player.w,h:player.h};if(rects(pb,bb)){if(player.vy>80&&oldBottom<=boss.y+18){boss.hp--;boss.flash=.22;player.vy=JUMP*.68;score+=500;tone(180,.16,'sawtooth',.04);if(boss.hp<=0){boss.active=false;score+=1000;tone(740,.25,'triangle',.04);}}else if(player.invulnerable<=0){lives--;player.invulnerable=1.25;player.vy=JUMP*.45;player.x=Math.max(0,player.x-55);if(lives<=0)over=true;}}}
if(player.y>H+150){lives--;if(lives<=0)over=true;player.x=Math.max(0,player.x-100);player.y=groundY()-player.h-100;player.vy=0;player.invulnerable=1.25;}
player.invulnerable=Math.max(0,player.invulnerable-dt);camera=Math.max(0,Math.min(WORLD-W,player.x-W*.36));if(player.x>2250&&!boss.active){if(level<10){level++;world=Math.ceil(level/5);player.x=70;camera=0;score+=1500;secretFound=false;coinItems.forEach(c=>c.taken=false);setupLevel();boss={x:2160,y:0,w:76,h:66,hp:2+Math.ceil(level/2),active:true,flash:0};resetEnemies();tone(660,.35,'triangle',.04);document.getElementById('levelLabel').textContent='УРОВЕНЬ '+level+' / 10';}else won=true;}updateHud();}
function drawText(t,x,y,size=18,color='#fff'){ctx.font=`900 ${size}px system-ui`;ctx.lineWidth=4;ctx.strokeStyle='#563719';ctx.strokeText(t,x,y);ctx.fillStyle=color;ctx.fillText(t,x,y);}
function drawBackground(){const skies=[['#36a9ff','#d9f6ff'],['#9a75d8','#f5d4ff'],['#ef9b54','#ffe2a8'],['#244d83','#9bd5ee'],['#458c63','#d7f2b5'],['#bd6e9e','#ffe0ed'],['#5365a8','#d9dcff'],['#b65b4b','#ffd6a5'],['#39566d','#b5d5dc'],['#4a327e','#e1c7ff']];const pal=skies[(level-1)%skies.length];const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,pal[0]);g.addColorStop(1,pal[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<7;i++){const x=((i*360-camera*.22)%(W+420))-120;ctx.fillStyle='#8ac8e8';ctx.beginPath();ctx.moveTo(x,H-25);ctx.lineTo(x+150,H-210);ctx.lineTo(x+310,H-25);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+145,H-205,20,0,7);ctx.arc(x+170,H-208,17,0,7);ctx.fill();}for(let i=0;i<10;i++){const x=((i*210-camera*.48)%(W+250))-100;ctx.fillStyle='#3baf53';ctx.beginPath();ctx.arc(x,H-45,43,Math.PI,0);ctx.fill();ctx.fillRect(x-43,H-45,86,45);}}
function drawPlatform(p){const x=p.x-camera;if(x+p.w<0||x>W)return;ctx.fillStyle='#8b4a22';ctx.fillRect(x,p.y,p.w,H-p.y+40);ctx.fillStyle='#a6ed42';ctx.fillRect(x,p.y,p.w,13);ctx.fillStyle='#5ebc27';for(let k=0;k<p.w;k+=22){ctx.beginPath();ctx.arc(x+k,p.y+3,9,0,Math.PI*2);ctx.fill();}}
function drawCoin(c){if(c.taken)return;const x=c.x-camera;ctx.fillStyle='#ffbd19';ctx.beginPath();ctx.ellipse(x,c.y,9,13,0,0,7);ctx.fill();ctx.strokeStyle='#fff080';ctx.lineWidth=3;ctx.stroke();drawText('1',x-3,c.y+4,10,'#9b5a00');}
function drawHero(){const x=player.x-camera,y=player.y,skin=skins[skinIndex];if(player.invulnerable>0&&Math.floor(player.invulnerable*12)%2===0)return;ctx.save();ctx.translate(x+player.w/2,y+player.h/2);if(player.face<0)ctx.scale(-1,1);ctx.translate(-player.w/2,-player.h/2);ctx.fillStyle='#183c9c';ctx.fillRect(6,34,30,25);ctx.fillStyle=skin.shirt;ctx.fillRect(3,28,36,18);ctx.fillStyle=skin.pants;ctx.fillRect(8,39,27,22);ctx.fillStyle='#f2c35d';ctx.fillRect(12,41,5,5);ctx.fillRect(27,41,5,5);ctx.fillStyle='#fff';ctx.fillRect(0,31,10,17);ctx.fillRect(33,31,10,17);ctx.fillStyle='#d92924';ctx.fillRect(4,58,15,8);ctx.fillRect(25,58,15,8);ctx.save();ctx.beginPath();ctx.arc(21,17,20,0,Math.PI*2);ctx.clip();if(face.complete&&face.naturalWidth)ctx.drawImage(face,-2,-4,47,45);else{ctx.fillStyle='#e5b18b';ctx.fillRect(0,0,42,40)}ctx.restore();ctx.fillStyle=skin.hat;ctx.beginPath();ctx.ellipse(21,2,22,8,0,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(2,1,38,5);ctx.fillStyle='#fff';ctx.font='bold 8px Arial';ctx.fillText('A',18,5);ctx.restore();}
function drawEnemy(e){const x=e.x-camera;ctx.fillStyle='#a65a2c';ctx.beginPath();ctx.ellipse(x+21,e.y+18,22,17,0,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(x+8,e.y+5,8,10);ctx.fillRect(x+26,e.y+5,8,10);ctx.fillStyle='#222';ctx.fillRect(x+11,e.y+8,4,5);ctx.fillRect(x+29,e.y+8,4,5);}
function drawHazards(){for(const h of hazards){const x=h.x-camera;if(x+h.w<0||x>W)continue;ctx.fillStyle=level===10?'#ff4b4b':'#d84b3e';ctx.beginPath();ctx.moveTo(x,groundY());ctx.lineTo(x+h.w/2,groundY()-h.h);ctx.lineTo(x+h.w,groundY());ctx.closePath();ctx.fill();ctx.strokeStyle='#ffe0a0';ctx.lineWidth=2;ctx.stroke();}}
function drawBoss(){if(!boss.active)return;const x=boss.x-camera,y=groundY()-boss.h;ctx.fillStyle=boss.flash>0?'#fff':(level===10?'#b51f43':'#783c9d');ctx.beginPath();ctx.roundRect(x,y+14,boss.w,boss.h-14,18);ctx.fill();ctx.fillStyle='#f6d65b';ctx.beginPath();ctx.moveTo(x+8,y+18);ctx.lineTo(x+15,y-5);ctx.lineTo(x+28,y+16);ctx.lineTo(x+46,y-8);ctx.lineTo(x+58,y+16);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(x+15,y+29,12,13);ctx.fillRect(x+49,y+29,12,13);ctx.fillStyle='#222';ctx.fillRect(x+19,y+33,5,7);ctx.fillRect(x+53,y+33,5,7);ctx.fillStyle='#4b174f';ctx.fillRect(x+20,y+51,38,6);ctx.fillStyle='#ff5b64';ctx.fillRect(x+20,y+51,38*(boss.hp/(world===1?3:4)),6);drawText(level===10?'ФИНАЛЬНЫЙ БОСС':'БОСС',x-8,y-15,12,'#fff');}
function drawCastle(){const x=2260-camera,y=groundY()-150;ctx.fillStyle='#d7d7dc';ctx.fillRect(x,y,94,150);ctx.fillStyle='#c74a43';ctx.beginPath();ctx.moveTo(x-8,y);ctx.lineTo(x+47,y-62);ctx.lineTo(x+102,y);ctx.fill();ctx.fillStyle='#68432b';ctx.fillRect(x+34,y+90,27,60);ctx.fillStyle='#fff';ctx.fillRect(x+15,y+35,18,25);ctx.fillRect(x+62,y+35,18,25);}
function drawOverlay(){if(!over&&!won&&!paused)return;ctx.fillStyle='#09294dcc';ctx.fillRect(0,0,W,H);const title=paused?'ПАУЗА':won?'ПОБЕДА! ВСЕ 10 УРОВНЕЙ ПРОЙДЕНЫ':'ИГРА ОКОНЧЕНА';ctx.textAlign='center';drawText(title,W/2,H/2-8,Math.min(27,W/13),'#ffe36b');drawText(paused?'Нажми ▶, чтобы продолжить':'Нажми на экран, чтобы начать заново',W/2,H/2+30,Math.min(15,W/22));ctx.textAlign='left';}
function render(){drawBackground();for(const p of platforms)drawPlatform(p);for(const c of coinItems)drawCoin(c);for(const e of enemies)drawEnemy(e);drawHazards();drawBoss();if(!secretFound){const sx=secretX-camera,sy=groundY()-145;ctx.fillStyle='#4c2c88';ctx.fillRect(sx-17,sy,34,34);ctx.fillStyle='#f6d65b';ctx.fillRect(sx-21,sy-7,42,9);ctx.fillStyle='#b8f4ff';ctx.fillRect(sx-5,sy+9,10,25);drawText('ТАЙНА',sx-25,sy-14,10,'#fff');}drawCastle();drawHero();drawOverlay();}
function frame(now){if(!lastTime)lastTime=now;const elapsed=Math.min((now-lastTime)/1000,.05);lastTime=now;update(elapsed);render();requestAnimationFrame(frame);}
canvas.addEventListener('pointerdown',()=>{if(over||won){restart()}else if(paused){togglePause()}});
resize();resetEnemies();restart();requestAnimationFrame(frame);
// Небольшой диагностический интерфейс для автоматической проверки в браузере.
window.__GAME_TEST__={getState:()=>({lives,coins:coinCount,bankCoins,unlockedSkins:[...unlockedSkins],score,won,over,paused,world,level,secretFound,bossHp:boss.hp,bossActive:boss.active,bestScore,skinIndex,musicOn,x:player.x,y:player.y,onGround:player.onGround,enemyCount:enemies.length}),press:(k,v)=>{if(k==='jump'&&v&&!input.jump)input.jumpQueued=true;if(k in input)input[k]=v;},step:update,restart};
</script></body></html>
